<!doctype html>
<meta charset="utf-8">
<title>Plume send history</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 860px; margin: 32px auto; }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { display: flex; align-items: center; gap: 12px; }
  button { font: inherit; padding: 6px 12px; cursor: pointer; }
  small { color: #666; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd; vertical-align: top; overflow-wrap: anywhere; }
  .ok { color: #15803d; font-weight: 600; } .bad { color: #b91c1c; font-weight: 600; }
  .dim { color: #666; }
</style>
<header>
  <h1><img src="../icons/icon-48.png" width="40" height="40" alt="">Send history</h1>
  <button id="settings" type="button">Settings</button>
</header>
<small>The last 50 send attempts from this browser: recipients, subject and outcome (never the message text). Stored only here.</small>
<div id="empty" hidden><p>Nothing sent yet.</p></div>
<table id="history" hidden>
  <thead><tr><th>When</th><th>Result</th><th>To</th><th>Subject</th><th>Relay</th></tr></thead>
  <tbody></tbody>
</table>
<button id="clear" hidden>Clear the list</button>
<script src="platform.js"></script>
<script src="history.js"></script>
<script src="history-page.js"></script>
