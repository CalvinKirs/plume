name: Build plume program

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default. Only the job that publishes a release asks for more.
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    # Debian 11 has glibc 2.31. A program built against a newer glibc refuses to start on older systems,
    # so building on the runner's own Ubuntu 22.04 (glibc 2.35) would exclude many distributions.
    container: python:3.12-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in the code
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(PYTHONPATH=server python3 -c 'import plume; print(plume.__version__)')" = "${GITHUB_REF_NAME}"
      - run: python3 -m unittest discover -s tests
        working-directory: server
      - run: ./packaging/build.sh plume-linux-x86_64
      - name: The built program starts, and its TLS verifies the ASF relay's certificate
        run: |
          ./dist/plume/plume --version
          ./dist/plume/plume check
      - uses: actions/upload-artifact@v4
        with: { name: plume-linux-x86_64, path: dist/plume-linux-x86_64.tar.gz }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: The tag must match the version in the code
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(PYTHONPATH=server python3 -c 'import plume; print(plume.__version__)')" = "${GITHUB_REF_NAME}"
      - run: python3 -m unittest discover -s tests
        working-directory: server
      - run: ./packaging/build.sh plume-macos-arm64
      - name: The built program starts, and its TLS verifies the ASF relay's certificate
        run: |
          ./dist/plume/plume --version
          ./dist/plume/plume check
      - uses: actions/upload-artifact@v4
        with: { name: plume-macos-arm64, path: dist/plume-macos-arm64.tar.gz }

  extension:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Build both browser packages with the same script
        run: |
          node extension/scripts/build-extension.js chrome --out dist/extension-chrome
          node extension/scripts/build-extension.js firefox --out dist/extension-firefox
      - name: Pack them
        run: |
          (cd dist/extension-chrome && zip -r ../../plume-extension.zip .)
          (cd dist/extension-firefox && zip -r ../../plume-extension-firefox.zip .)
      - uses: actions/upload-artifact@v4
        with: { name: plume-extension, path: "plume-extension*.zip" }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, extension]
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
