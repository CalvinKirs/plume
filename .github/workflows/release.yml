name: Build plume program

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    # Debian 11 has glibc 2.31. A program built against a newer glibc refuses to start on older systems,
    # so building on the runner's own Ubuntu 22.04 (glibc 2.35) would exclude many distributions.
    container: python:3.12-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in the code
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(PYTHONPATH=server python3 -c 'import plume; print(plume.__version__)')" = "${GITHUB_REF_NAME}"
      - run: python3 -m unittest discover -s tests
        working-directory: server
      - run: ./packaging/build.sh plume-linux-x86_64
      - name: The built program starts and reports its version
        run: ./dist/plume/plume --version
      - uses: actions/upload-artifact@v4
        with: { name: plume-linux-x86_64, path: dist/plume-linux-x86_64.tar.gz }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: The tag must match the version in the code
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(PYTHONPATH=server python3 -c 'import plume; print(plume.__version__)')" = "${GITHUB_REF_NAME}"
      - run: python3 -m unittest discover -s tests
        working-directory: server
      - run: ./packaging/build.sh plume-macos-arm64
      - name: The built program starts and reports its version
        run: ./dist/plume/plume --version
      - uses: actions/upload-artifact@v4
        with: { name: plume-macos-arm64, path: dist/plume-macos-arm64.tar.gz }

  extension:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Pack only what the browser needs
        run: cd extension && zip -r ../plume-extension.zip manifest.json src icons
      - uses: actions/upload-artifact@v4
        with: { name: plume-extension, path: plume-extension.zip }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, extension]
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
