name: Build plume program

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, name: plume-linux-x86_64 }   # older glibc, so the binary runs on most distributions
          - { os: macos-14, name: plume-macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: The tag must match the version in the code
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(PYTHONPATH=server python3 -c 'import plume; print(plume.__version__)')" = "${GITHUB_REF_NAME}"
      - run: python3 -m unittest discover -s tests
        working-directory: server
      - run: ./packaging/build.sh ${{ matrix.name }}
      - name: The built program starts and reports its version
        run: ./dist/plume/plume --version
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: "dist/${{ matrix.name }}.tar.gz" }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          prerelease: ${{ contains(github.ref_name, '-') }}
